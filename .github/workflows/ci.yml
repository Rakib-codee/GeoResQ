name: CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-and-test:
    name: Test Suite & Governance Audit (Python 3.11 + PyTorch CPU)
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install CPU PyTorch & GeoResQ package
        run: |
          python -m pip install --upgrade pip
          pip install --index-url https://download.pytorch.org/whl/cpu torch
          pip install PyYAML
          pip install -e .

      - name: Compile all Python modules and scripts
        run: python -m compileall -q src scripts tests

      - name: Verify repository hygiene (zero raw imagery or model weights tracked)
        run: |
          python - << 'PYCHECK'
          import subprocess
          tracked = subprocess.check_output(["git", "ls-files"], text=True).splitlines()
          forbidden_exts = (".tif", ".tiff", ".geotiff", ".pth", ".pt", ".ckpt", ".safetensors", ".zip")
          bad = [f for f in tracked if f.lower().endswith(forbidden_exts)]
          assert not bad, f"Forbidden binary artifacts tracked in Git: {bad}"
          print(f"Verified {len(tracked)} tracked files — zero raw imagery or checkpoint binaries.")
          PYCHECK

      - name: Run full 21-test unit suite (0 skipped with PyTorch installed)
        run: python -m unittest discover -s tests -v

      - name: Run benchmark, stress-test, failure-audit & CLI dry-runs
        run: |
          python scripts/train_v0_2_benchmark.py --dry-run
          python scripts/run_stress_test.py --dry-run
          python scripts/run_failure_analysis.py --dry-run
          georesq-predict --demo-synthetic --output-dir /tmp/ci_triage_out --device cpu
