# GeoResQ Milestone 5 — Medium-Scale 11-Disaster Benchmark (BRIGHT v0.2: 294 Tiles)
# Incorporates Milestone 4 diagnosis: LitePriorGatedFusion, 1x Boundary Skip,
# tempered class weights (power=0.15), and Auxiliary Building Localization BCE+Dice.

experiment:
  suite_name: "benchmark_v0_2"
  seed: 42
  subset_version: "v0.2"
  manifest_relpath: "results/metrics/manifest_v0_2.csv"

shared_data:
  norm_mode: "modality_specific_v0_2"
  stack_sar_3ch: true
  input_modality: "multimodal"

optimization:
  epochs: 22
  val_every_epochs: 2
  train_batch_size: 4
  eval_batch_size: 2
  crop_size: 512
  optimizer: "adamw"
  learning_rate: 0.0003
  backbone_lr_scale: 0.33
  weight_decay: 0.001
  lr_scheduler: "cosine"
  min_lr: 0.00001
  use_amp: true
  lovasz_weight: 0.75
  use_train_class_weights: true
  class_weight_power: 0.15
  aux_loc_weight: 0.5
  num_workers: 2
  save_every_epochs: 5
  selection_metric: "mIoU_foreground3"

variants:
  optical_only_v0_2:
    label: "Optical-Only (R18 + 1xSkip + AuxLoc)"
    short_name: "Optical-Only (v0.2)"
    architecture: "dual_stream_unet"
    backbone: "resnet18"
    fusion_mode: "optical_only"
    pretrained: true
    dropout_p: 0.1
    use_fullres_skip: true
    aux_loc_head: true
  sar_only_v0_2:
    label: "SAR-Only (R18 + 1xSkip + AuxLoc)"
    short_name: "SAR-Only (v0.2)"
    architecture: "dual_stream_unet"
    backbone: "resnet18"
    fusion_mode: "sar_only"
    pretrained: true
    dropout_p: 0.1
    use_fullres_skip: true
    aux_loc_head: true
  dual_concat_v0_2:
    label: "Dual-Stream Concat (R18 + 1xSkip + AuxLoc)"
    short_name: "Dual Concat (v0.2)"
    architecture: "dual_stream_unet"
    backbone: "resnet18"
    fusion_mode: "concat"
    pretrained: true
    dropout_p: 0.1
    use_fullres_skip: true
    aux_loc_head: true
  lite_gated_fusion_v0_2:
    label: "GeoResQ Lite Prior-Gated Fusion (Ours, v0.2)"
    short_name: "Lite Gated Fusion (Ours)"
    architecture: "dual_stream_unet"
    backbone: "resnet18"
    fusion_mode: "lite_gated_fusion"
    pretrained: true
    dropout_p: 0.1
    use_fullres_skip: true
    aux_loc_head: true
