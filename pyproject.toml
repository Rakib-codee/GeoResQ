[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "georesq"
version = "0.2.0"
description = "All-Weather Multimodal Optical-SAR Building Damage Assessment & Stress-Testing Suite"
readme = "README.md"
license = {text = "Apache-2.0"}
requires-python = ">=3.10"
authors = [
    {name = "Rakib Islam"}
]
keywords = [
    "remote-sensing",
    "synthetic-aperture-radar",
    "multimodal-fusion",
    "building-damage-assessment",
    "disaster-response",
    "semantic-segmentation",
    "bright-dataset"
]
dependencies = [
    "numpy>=1.24",
    "Pillow>=10.0",
    "matplotlib>=3.7",
]

[project.optional-dependencies]
gpu = [
    "torch>=2.1",
    "torchvision>=0.16",
    "PyYAML>=6.0",
    "rasterio>=1.3",
]

[project.scripts]
georesq-predict = "georesq.cli.predict:main"

[tool.setuptools.packages.find]
where = ["src"]
